<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130">
  <!-- White background -->
  <rect width="200" height="130" fill="#ffffff"/>

  <!-- M (orange): solid rectangle with triangular V-notch cut from bottom center -->
  <path fill="#F97316" fill-rule="evenodd" d="
    M 0,0 L 105,0 L 105,130 L 0,130 Z
    M 28,130 L 52,50 L 76,130 Z
  "/>

  <!-- P (black): left stem covers M's right section + D-shaped bowl -->
  <rect fill="#111827" x="77" y="0" width="28" height="130"/>
  <path fill="#111827" d="M 105,0 Q 210,37 105,74 Z"/>
</svg>
